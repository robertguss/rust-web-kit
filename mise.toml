# Tool versions for this starter. rust stays on stable and node on LTS as specified
# in docs/PLAN.md. Other tools are pinned to versions current on 2026-09-12.

[tools]
rust = "stable"
node = "lts"
pnpm = "12.4.1"
just = "1.58.0"
hk = "1.58.1"
fnox = "1.35.1"
age = "1.3.2"
# rustls so install does not require OpenSSL headers (default features pull openssl-sys).
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = ["postgres", "rustls"] }
"cargo:cargo-nextest" = "0.9.144"
"cargo:bacon" = "3.25.0"
