name: rwk

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rwk
      POSTGRES_USER: rwk
      POSTGRES_PASSWORD: rwk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rwk -d rwk"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
