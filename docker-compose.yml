name: rwk

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: rwk
      POSTGRES_USER: rwk
      POSTGRES_PASSWORD: rwk
    ports:
      # Override with RWK_DB_PORT when 5432 is already taken on the host.
      - "${RWK_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 stores data in /var/lib/postgresql/<major>/docker and
      # declares /var/lib/postgresql as the volume. Do not use the pre-18
      # /var/lib/postgresql/data path here.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rwk -d rwk"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
